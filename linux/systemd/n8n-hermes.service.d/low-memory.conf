# Keep n8n lean: cap the V8 heap, drop UI extras the agent never uses, prune old executions.
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=640
Environment=N8N_VERSION_NOTIFICATIONS_ENABLED=false
Environment=N8N_TEMPLATES_ENABLED=false
Environment=N8N_PERSONALIZATION_ENABLED=false
Environment=N8N_HIRING_BANNER_ENABLED=false
Environment=EXECUTIONS_DATA_PRUNE=true
Environment=EXECUTIONS_DATA_MAX_AGE=72
Environment=EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
MemoryHigh=600M
MemoryMax=1G
CPUWeight=50
Nice=10
