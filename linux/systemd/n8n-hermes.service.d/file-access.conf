# send_email attachments: the Read Attachments node may only open files Hermes staged for
# delivery (sandbox_to_drive output + inbound email attachments). n8n realpaths before checking,
# so ../ and symlinks can't escape. The Guard node in hermes__send_email checks the same root.
[Service]
Environment=N8N_RESTRICT_FILE_ACCESS_TO=/home/hemang/.hermes/profiles/team/cache/documents
