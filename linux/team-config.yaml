_config_version: 49
agent:
  max_turns: 150
  personalities: {}
  reasoning_effort: high
  verbose: false
  pre_verify_platforms:
  - email
  - cron
  max_verify_nudges: 3
approvals:
  destructive_slash_confirm: false
browser:
  backend: browser-use
  extension_control:
    enabled: false
  inactivity_timeout: 120
code_execution:
  max_tool_calls: 50
  timeout: 300
compression:
  codex_app_server_auto: native
  codex_gpt55_autoraise: true
  codex_responses_compact_threshold: 200000
  codex_responses_native: false
  enabled: true
  idle_compact_after_seconds: 0
  max_attempts: 3
  min_tail_user_messages: 1
  proactive_prune_min_reclaim_tokens: 4096
  proactive_prune_min_result_chars: 8000
  proactive_prune_tokens: 0
  progress_notices: false
  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.2
  threshold: 0.5
computer_use:
  backend: cua
database:
  journal_mode: wal
delegation:
  max_iterations: 250
display:
  background_process_notifications: concise
  bell_on_complete: false
  busy_ack_detail: true
  busy_input_mode: interrupt
  cleanup_progress: false
  compact: false
  interim_assistant_messages: true
  long_running_notifications: true
  show_reasoning: false
  skin: default
  streaming: true
  tool_progress: all
  platforms:
    email:
      tool_progress: 'off'
      interim_assistant_messages: false
      long_running_notifications: false
      busy_ack_detail: false
      streaming: false
fallback_providers:
- model: meituan/longcat-2.5-preview:free
  provider: nous
- model: stepfun/step-3.7-flash:free
  provider: nous
- model: upstage/solar-pro4:free
  provider: nous
- model: meituan/longcat-2.0:free
  provider: nous
group_sessions_per_user: true
hooks:
  post_tool_call:
  - command: 'sh -c ''cd "${CLAUDE_PROJECT_DIR:-.}" 2>/dev/null || exit 0; d=$PWD;
      while [ ! -f "$d/.bdrive/config.json" ]; do case "$d" in ""|/) d=; break;; esac;
      d=${d%/*}; done; [ -n "$d" ] || case "$PWD" in *"

      "*) exit 0;; esac; [ -n "$d" ] || grep -qF "\"$PWD/" "${BDRIVE_HOME:-$HOME/.bdrive}/mounts.json"
      2>/dev/null || exit 0; command -v bdrive >/dev/null || exit 0; s=; [ -t 0 ]
      || s=$(head -c 8192 2>/dev/null | tr -d \" | sed -n "s/.*session_id[[:space:]]*:[[:space:]]*\([a-zA-Z0-9_-]*\).*/\1/p"
      | head -n 1); if [ -n "$s" ]; then bdrive sync . --note "hermes session $s"
      >/dev/null 2>&1 || true; else bdrive sync . >/dev/null 2>&1 || true; fi'''
    matcher: write_file|patch
    timeout: 30
  - command: 'sh -c ''cd "${CLAUDE_PROJECT_DIR:-.}" 2>/dev/null || exit 0; d=$PWD;
      while [ ! -f "$d/.bdrive/config.json" ]; do case "$d" in ""|/) d=; break;; esac;
      d=${d%/*}; done; [ -n "$d" ] || case "$PWD" in *"

      "*) exit 0;; esac; [ -n "$d" ] || grep -qF "\"$PWD/" "${BDRIVE_HOME:-$HOME/.bdrive}/mounts.json"
      2>/dev/null || exit 0; command -v bdrive >/dev/null || exit 0; bdrive read-log
      . >/dev/null 2>&1 || true'''
    matcher: read_file|grep|bash
    timeout: 30
  pre_llm_call:
  - command: 'sh -c ''cd "${CLAUDE_PROJECT_DIR:-.}" 2>/dev/null || exit 0; d=$PWD;
      while [ ! -f "$d/.bdrive/config.json" ]; do case "$d" in ""|/) d=; break;; esac;
      d=${d%/*}; done; [ -n "$d" ] || case "$PWD" in *"

      "*) exit 0;; esac; [ -n "$d" ] || grep -qF "\"$PWD/" "${BDRIVE_HOME:-$HOME/.bdrive}/mounts.json"
      2>/dev/null || exit 0; command -v bdrive >/dev/null || exit 0; s=; [ -t 0 ]
      || s=$(head -c 8192 2>/dev/null | tr -d \" | sed -n "s/.*session_id[[:space:]]*:[[:space:]]*\([a-zA-Z0-9_-]*\).*/\1/p"
      | head -n 1); if [ -n "$s" ]; then bdrive sync . --note "hermes session $s"
      >/dev/null 2>&1 || true; else bdrive sync . >/dev/null 2>&1 || true; fi'''
    timeout: 30
