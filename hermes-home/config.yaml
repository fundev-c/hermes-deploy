platforms:
  email:
    enabled: true
    # Slash-command gating (gateway/slash_access.py). With no admin list, EVERY allowed sender
    # may run every slash command -- including /skills approve and /skills approval off once
    # skills.write_approval is on. A reserved .invalid address enables gating with no email
    # admin at all: skill approval happens only at this PC. Non-admins keep /help and /whoami.
    allow_admin_from: [no-email-admins@admin.invalid]
    group_allow_admin_from: [no-email-admins@admin.invalid]
    # 2026-09-25: members may start a fresh conversation (/new, alias /reset). Email sessions
    # never end on their own and keep the tool list + skill index they started with, so /new is
    # how a member picks up newly approved skills -- and how a pre-lockdown session is retired.
    user_allowed_commands: [new]
mcp_servers:
  n8n-tools:
    enabled: true
    url: http://127.0.0.1:5678/mcp/hermes
    headers:
      Authorization: Bearer ${N8N_MCP_TOKEN}
    trust: full
    timeout: 120
    connect_timeout: 60
    keepalive_interval: 60
onboarding:
