delegation:
  max_iterations: 250
skills:
  creation_nudge_interval: 15
  # 2026-09-24 (Bear_Drive\PRD.md 4.6): email/cron may learn skills, but every skill_manage
  # write is STAGED until a human approves it at this PC (`hermes` -> /skills pending,
  # /skills diff <id>, /skills approve|reject <id>). Emailers cannot approve: see
  # platforms.email.allow_admin_from.
  write_approval: true
  # The email/cron agent has no terminal, so the scan here is not redundant (the default-off
  # rationale is that terminal() runs the same code ungated).
  guard_agent_created: true
  # Hide every skill that existed before learning was switched on from email/cron, so those
  # sessions see only skills learned from team tasks (hermes-agent is essential and exempt).
  # A future `hermes update` that adds bundled skills will NOT be hidden automatically.
  platform_disabled:
    email: &pre_learning_skills [airtable, apple-notes, apple-reminders, 
          architecture-diagram, arxiv, ascii-art, ascii-video, baoyu-infographic,
      blocked-page-recovery, blogwatcher, box, claude-code, claude-design, 
          codebase-inspection, codex, comfyui, competitor-news-monitor, 
          computer-use, design-md, document-to-action-items, docx, dogfood, 
          email-inbox-triage, evaluating-llms-harness, excalidraw, findmy, 
          gif-search, github, github-auth, github-code-review, 
          github-issue-to-pr, github-issues, github-pr-workflow, 
          github-repo-management, google-workspace, grounded-citations, 
          hermes-agent, hermes-agent-skill-authoring, himalaya, huggingface-hub, 
          humanizer, imessage, inspecting-hermes-desktop-dom, llama-cpp, 
          llm-wiki, manim-video, maps, meeting-action-items, merge-reconciler, 
          nano-pdf, node-inspect-debugger, notion, obsidian, ocr-and-documents, 
          opencode, openhue, p5js, pdf, plan, popular-web-designs, powerpoint, 
          pretext, product-price-monitor, python-debugpy, requesting-code-review,
      research-paper-writing, sdlc-review, serving-llms-vllm, session-librarian, 
          simplify-code, sketch, songsee, songwriting-and-ai-music, spike, 
          systematic-debugging, teams-meeting-pipeline, test-driven-development, 
          touchdesigner-mcp, weekly-review-planning, weights-and-biases, xlsx, 
          xurl, youtube-content]
    cron: *pre_learning_skills
